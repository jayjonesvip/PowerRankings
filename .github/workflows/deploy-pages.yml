name: Sync sports data and deploy PowerRankings
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
    - cron: "0 9 * * 2"
      timezone: "America/New_York"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:data
      - uses: actions/cache@v4
        with:
          path: public/data
          key: nfl-json-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nfl-json-
      - run: pnpm data:refresh
      - run: pnpm data:refresh:mvp
      - run: pnpm data:refresh:nhl
      - run: pnpm data:refresh:mlb
      - name: Publish due weekly rankings from stored regular-season data
        run: node scripts/publish-weekly-rankings.mjs
      - name: Persist weekly editions independently of the hourly data cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/power-rankings
          if ! git diff --cached --quiet; then
            git commit -m "Publish weekly power rankings editions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm build:github
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: node scripts/verify-export.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
